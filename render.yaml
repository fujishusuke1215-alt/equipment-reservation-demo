services:
  - type: web
    name: equipment-reservation-demo-api
    runtime: docker
    dockerfilePath: ./backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: development
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
  - type: web
    name: equipment-reservation-demo-ui
    runtime: static
    buildCommand: cd frontend && npm install -g pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://equipment-reservation-demo-api.onrender.com/api/*
      - type: rewrite
        source: /openapi.yaml
        destination: https://equipment-reservation-demo-api.onrender.com/openapi.yaml
      - type: rewrite
        source: /*
        destination: /index.html
